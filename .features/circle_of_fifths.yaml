feature_name: circle_of_fifths
purpose: "Rotate the circle so the active key sits at 12 o'clock and drag diatonic or neighbouring triads into bars."

entry_points:
  - src/gui/CircleOfFifthsComponent.cpp
  - src/MainComponent.cpp

apps:
  - chords_and_tabs

user_flow:
  primary: "User → click wedge, mouse wheel, h/l, or ←/→ → rotate(); tonic at 12 o'clock; onSelectionChanged"
  drag: "User → drag outer/inner wedge or DiatonicChip → encodeChord payload onto a bar slot"
  preview: "User → hover/press wedge → onChordPreview lights the piano triad"

related_features:
  - music_theory (stations, diatonic triads, numerals, encodeChord)
  - chord_slots (drop target)
  - region_focus (h/l rotate when Circle focused)
  - piano_keyboard (preview highlight)
  - agent_api (keyIndex in AgentView)

core_components:
  - src/gui/CircleOfFifthsComponent.h
  - src/theory/MusicTheory.h
